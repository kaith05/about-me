<div class="bg-white p-6 md:p-10 rounded-2xl border border-gray-200/80 shadow-sm w-full">
    <h2 class="text-xl font-bold text-gray-800 tracking-wide mb-8 text-center border-b border-gray-100 pb-4">
        お問い合わせフォーム
    </h2>
    <form action="submit_contact.php" method="post" class="space-y-6">
        {% csrf_token %}
        <div class="flex flex-col space-y-2">
            <label for="name" class="text-sm font-semibold text-gray-700">お名前</label>
            <input type="text" id="name" name="name" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-amber-500 focus:bg-white transition text-gray-800">
        </div>
        <div class="flex flex-col space-y-2">
            <label for="email" class="text-sm font-semibold text-gray-700">メールアドレス</label>
            <input type="email" id="email" name="email" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-amber-500 focus:bg-white transition text-gray-800">
        </div>
        <div class="flex flex-col space-y-2">
            <label for="message" class="text-sm font-semibold text-gray-700">メッセージ</label>
            <textarea id="message" name="message" rows="5" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-amber-500 focus:bg-white transition text-gray-800 resize-none"></textarea>
        </div>
        <div class="pt-4">
            <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-medium rounded-xl shadow-xs transition duration-200 active:scale-[0.99]">
                送信する
            </button>
        </div>
    </form>
</div>
