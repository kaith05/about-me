{% extends 'base.html' %}
{% load static %}

{% block title %}リメイク商品 | Re&Re Repair&Remake{% endblock %}

{% block content %}
<div class="w-full bg-amber-50/50 border-b border-gray-100 py-16 text-center">
    <div class="max-w-3xl mx-auto px-4 space-y-3">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 tracking-wider">REMAKE PRODUCTS</h1>
        <p class="text-gray-600 font-light text-sm md:text-base">
            思い出の詰まったお洋服や小物を、新しく生まれ変わらせた作品たちです。
        </p>
    </div>
</div>

<main class="max-w-6xl mx-auto px-4 py-16">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        
        {% for image_name in images %}
        <div class="group bg-white rounded-xl overflow-hidden border border-gray-200 shadow-xs hover:shadow-md transition-all duration-300 hover:-translate-y-1">
            
            <div class="aspect-[3/2] w-full bg-gray-50 overflow-hidden relative border-b border-gray-100">
                <img src="{% static 'remake-images/' %}{{ image_name }}" alt="リメイク商品" class="w-full h-full object-cover object-center group-hover:scale-103 transition-transform duration-500">
                <div class="absolute inset-0 bg-black/[0.02] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </div>
            
            <div class="p-4 bg-white">
                <p class="text-gray-800 font-medium text-sm tracking-wide">リメイク作品</p>
            </div>
            
        </div>
        {% empty %}
        <div class="col-span-full text-center py-12">
            <p class="text-gray-400">現在、公開できるリメイク商品がありません。</p>
        </div>
        {% endfor %}

    </div>
</main>
{% endblock %}
